# Les verifications du projet ne tournaient jusqu'ici que sur la machine
# de l'auteur, a la main. Ce workflow les lance a chaque push.
#
# Deux details insidersistent et ne sont pas des mobiles :
#
# - Le projet est verifie avec la meme version que celle annoncee dans le
#   README et `project.godot`. La version est repetee dans `GODOT_VERSION`
#   ci-dessous, et `README.md` la reprend : les trois doivent changer ensemble.
#
# - Les suites sont sensibles au temps qui passe. Sous charge CPU — deux
#   tourneurs en parallèle, ou un simple `godot` lancé juste avant — l'UI peut
#   rater le contrôle des fissures de minage, et le réseau dépasser son délai.
#   Un échec là est du bruit, pas une régression : chaque suite passe par
#   `.github/scripts/run-suite.sh`, qui réessaie trois fois.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Verifications
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GODOT_VERSION: 4.7.2-stable
      ATTEMPTS: 3

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v7

      - name: Recuperer Godot
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "$url" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"
          "$HOME/godot" --version

      # Le cache porte sur l'import des ressources, qui est long (textures,
      # sons et icones sont tous generes au premier lancement).
      - name: Cache de l'import
        uses: actions/cache@v6
        with:
          path: .godot
          key: godot-import-${{ hashFiles('project.godot') }}
          restore-keys: godot-import-

      - name: Importer le projet
        run: "$HOME/godot --headless --import"

      - name: Rendre le script de reessai executable
        run: chmod +x .github/scripts/run-suite.sh

      - name: SmokeTest
        run: .github/scripts/run-suite.sh SmokeTest "$HOME/godot" --headless --script res://tools/SmokeTest.gd

      - name: Interface
        run: .github/scripts/run-suite.sh Interface "$HOME/godot" --headless --uitest --distance=3

      - name: Reseau
        run: .github/scripts/run-suite.sh Reseau "$HOME/godot" --headless --script res://tools/NetTest.gd

      - name: Contenu atteignable
        run: .github/scripts/run-suite.sh Contenu "$HOME/godot" --headless --script res://tools/CheckContent.gd

      - name: Eclairage
        run: .github/scripts/run-suite.sh Eclairage "$HOME/godot" --headless --script res://tools/CheckLights.gd

      # Les autres scripts de `tools/` (dumps, capture de tuiles, eclairage,
      # apercu des icones) servent au developpement et n'ont pas d'assertion :
      # les lancer ici n'aurait rien verifie. Seules les cinq suites ci-dessus
      # rendent un code de sortie qui compte.
